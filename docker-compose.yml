version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: qa_backend
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=shopfloor_super_secret_jwt_key_2026
    volumes:
      - ./server/prisma:/app/prisma
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: qa_frontend
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped